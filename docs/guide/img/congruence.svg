<line x1="497.5" y1="340.0" x2="497.5" y2="40.0" stroke="#eee"/>
<text x="497.5" y="358" font-size="12" text-anchor="middle">36</text>
<line x1="542.5" y1="340.0" x2="542.5" y2="40.0" stroke="#eee"/>
<text x="542.5" y="358" font-size="12" text-anchor="middle">40</text>
