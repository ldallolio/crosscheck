<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<rect width="640" height="400" fill="white"/>
<text x="320.0" y="24" font-size="16" text-anchor="middle" font-weight="bold">r0 at the back edge of: r0 = 0; do r0 += 4; while (r0 != 40)</text>
<line x1="92.5" y1="340.0" x2="92.5" y2="40.0" stroke="#eee"/>
