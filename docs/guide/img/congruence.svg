<text x="549.2" y="253.8" font-size="12" fill="#d1495b" text-anchor="start">40: exit</text>
<text x="92.5" y="302.5" font-size="12" fill="#555555" text-anchor="start">the next value is r0 + 4 &lt;= 40: the loop has a potential (40 - r0)/4</text>
<rect x="354" y="38" width="250" height="60" fill="white" fill-opacity="0.85" stroke="#ccc"/>
<line x1="360" y1="50" x2="384" y2="50" stroke="#1f6fb2" stroke-width="2.5"/>
