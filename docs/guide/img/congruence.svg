<line x1="70" y1="40" x2="70" y2="340" stroke="#333"/>
<text x="340.0" y="384" font-size="13" text-anchor="middle">value of r0</text>
<text x="16" y="190.0" font-size="13" text-anchor="middle" transform="rotate(-90 16 190.0)"></text>
<path d="M92.5,115.0 L531.2,115.0" fill="none" stroke="#1f6fb2" stroke-width="6"/>
<circle cx="553.8" cy="115.0" r="5" fill="#d1495b"/>
