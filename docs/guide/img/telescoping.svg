<text x="77.7" y="60.0" font-size="11" fill="#1f6fb2" text-anchor="start">entry 68</text>
<text x="154.9" y="304.0" font-size="11" fill="#1f6fb2" text-anchor="start">cmp 7</text>
<text x="232.0" y="308.0" font-size="11" fill="#1f6fb2" text-anchor="start">bge 6</text>
