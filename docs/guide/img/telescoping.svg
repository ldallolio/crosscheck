<text x="540.6" y="332.0" font-size="11" fill="#1f6fb2" text-anchor="start">exit 0</text>
<text x="162.6" y="172.0" font-size="12" fill="#555555" text-anchor="start">edge u→v accepted if  cost(e) + π(v) − π(u) ≤ multiplier terms</text>
<text x="162.6" y="196.0" font-size="12" fill="#555555" text-anchor="start">the back edge borrows 6 cycles from the loop row (multiplier 6)</text>
<text x="162.6" y="220.0" font-size="12" fill="#555555" text-anchor="start">summing along any run: cost ≤ π(entry) − π(exit) = 68</text>
