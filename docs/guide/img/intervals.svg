<text x="128.9" y="104.8" font-size="12" fill="#1f6fb2" text-anchor="start">call 1: f(k), 4 ≤ k ≤ 10</text>
<path d="M148.5,148.0 L150.0,148.0" fill="none" stroke="#d1495b" stroke-width="7"/>
