<path d="M70.0,196.0 L110.7,196.0" fill="none" stroke="#2a9d5b" stroke-width="7"/>
<text x="119.1" y="200.8" font-size="12" fill="#2a9d5b" text-anchor="start">call 3: f(m), 0 ≤ m &lt; 9</text>
