<line x1="462.7" y1="340.0" x2="462.7" y2="40.0" stroke="#eee"/>
<text x="462.7" y="358" font-size="12" text-anchor="middle">80</text>
<line x1="511.8" y1="340.0" x2="511.8" y2="40.0" stroke="#eee"/>
