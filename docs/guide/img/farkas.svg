<text x="62" y="231.5" font-size="12" text-anchor="end">4</text>
<line x1="70.0" y1="190.0" x2="610.0" y2="190.0" stroke="#eee"/>
<text x="62" y="194.0" font-size="12" text-anchor="end">6</text>
<line x1="70.0" y1="152.5" x2="610.0" y2="152.5" stroke="#eee"/>
<text x="62" y="156.5" font-size="12" text-anchor="end">8</text>
