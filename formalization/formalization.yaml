# Machine-readable link between the papers and the Lean 4 development: Paper I
# (paper/theory/crosscheck-theory.tex, Table 1) by default, Paper III
# (paper/binary/crosscheck-binary.tex, Table tab:lean3) where `paper:` says so. Keep them in sync.
# NOTE: the schema below is project-defined. It has NOT been validated against
# any community specification for formalization metadata.
project: CrossCheck
paper: paper/theory/crosscheck-theory.tex
lean_toolchain: leanprover/lean4:v4.16.0
mathlib: v4.16.0
root_module: ImperativeOptimization
namespace: ImperativeOptimization
build: "cd formalization && lake exe cache get && lake build"
status: "formalized modulo the items listed under not_formalized"
sorry_free: true
custom_axioms: []
standard_axioms: [propext, Quot.sound, Classical.choice]
statements:
  - paper_labels: [eq:iter-hom]
    module: ImperativeOptimization.FixedPoint
    lean: [evalTrace_concat, evalTrace_iter]
  - paper_labels: [def:subadditive-norm]
    module: ImperativeOptimization.Trace
    lean: [wcost_append, wcost_iter, wcost_one]
  - paper_labels: [prop:poset-properties]
    module: ImperativeOptimization.Trace
    lean: [order_refl, order_trans, order_antisymm, order_cost_le, cost_additive, cost_iter]
  - paper_labels: [prop:n-monotony]
    module: ImperativeOptimization.Trace
    lean: [iter_monotone_iff]
  - paper_labels: [thm:minimal-trace]
    module: ImperativeOptimization.Trace
    lean: [exists_minimal_iteration]
  - paper_labels: [prop:worst-case-step]
    module: ImperativeOptimization.WhileLoop
    lean: [runTrace_cost_le, runTrace_wcost_le]
  - paper_labels: [prop:nested-cost]
    module: ImperativeOptimization.Trace
    lean: [nested_trace_cost, sequential_loops_cost, sequential_loops_prefix]
  - paper_labels: [def:subadditive-norm, prop:poset-properties, thm:minimal-trace, prop:worst-case-step, prop:tropical-dominance, prop:tropical-collapse, prop:min_x, thm:lyapunov-bound]
    module: ImperativeOptimization.Norms
    lean: [CostNorm, costNorm, wcostNorm, CostNorm.flatten_le, CostNorm.runTrace_le, CostNorm.condTrace_le, CostNorm.blocks_le, CostNorm.wcet_bound, order_nil, order_wf, minimal_iteration_least, runTrace_prefix]
  - paper_labels: [prop:tropical-dominance, prop:tropical-collapse]
    module: ImperativeOptimization.Dominance
    lean: [condTrace_cost_le, branch_supremum_bound]
  - paper_labels: [thm:extensional-equivalence]
    module: ImperativeOptimization.WhileLoop
    lean: [while_trace_semantics]
  - paper_labels: [prop:min_x]
    module: ImperativeOptimization.WhileLoop
    lean: [whileBigStep_iff_minimalExit, MinimalExit.unique]
  - paper_labels: [prop:tree-order-properties]
    module: ImperativeOptimization.Tree
    lean: [treePrefix_refl, treePrefix_trans, treePrefix_antisymm, treePrefix_size_le, treePrefix_graft, treePrefix_fullTree, size_le_of_depth_le, treePrefix_depth_le]
  - paper_labels: [prop:tree-power-complexity]
    module: ImperativeOptimization.Tree
    lean: [treePow_leafCount, treePow_size, treePow_cherry, treePow_chain, graft_size, graft_assoc]
  - paper_labels: [def:tree-algebra, def:tree-order, def:tree-exponentiation, prop:tree-order-properties, prop:tree-power-complexity, prop:tree-optimization]
    note: "every branching factor b (the rows above: binary trees)"
    module: ImperativeOptimization.Branching
    lean: [KTree, KTree.Le, KTree.le_refl, KTree.le_trans, KTree.le_antisymm, KTree.leaf_le, KTree.size_mono, KTree.depth_mono, KTree.le_graft, KTree.graft_leaves, KTree.graft_size, KTree.size_full, KTree.le_full, KTree.size_le_of_depth, KTree.size_le_closed, KTree.pow_leaves, KTree.pow_size_succ, KTree.pow_size_closed, KTree.pow_size_rat, KTree.pow_step, KTree.pow_chain, KRecurrence.exec_feasible, KRecurrence.exec_least, KRecurrence.exec_unique, KRecurrence.exec_size_min, KRecurrence.exec_depth_min, KRecurrence.bigStep_iff, tern_exec, tern_cost]
  - paper_labels: [prop:linrec]
    module: ImperativeOptimization.Recursion
    lean: [framedBigStep_iff, linRec_iff, linear_recursion_cost]
  - paper_labels: [prop:tree-optimization]
    module: ImperativeOptimization.Recursion
    lean: [exec_least, exec_unique, treeBigStep_iff, exec_size_min]
  - paper_labels: [thm:lyapunov-bound]
    module: ImperativeOptimization.Ranking
    lean: [ranking_bound, ranking_terminates, wcet_bound]
  - paper_labels: [prop:tree-envelope]
    module: ImperativeOptimization.Recursion
    lean: [exec_depth_le, exec_size_le]
  - paper_labels: [thm:lyapunov-bound]
    note: "relational variant with potentials valued in an ordered field"
    module: ImperativeOptimization.Certificate
    lean: [ranking_bound_floor, ranking_bound_of_le, while_ranking_floor, partial_ranking_floor]
  - paper_labels: [def:valid-triple, def:derivable-triple]
    note: "small imperative language, cost semantics (terminating executions and prefixes), cost triples"
    module: ImperativeOptimization.Language
    lean: [Cmd, Exec, Pre, Valid, Specs, Derivable]
  - paper_labels: [thm:cost-logic-soundness]
    module: ImperativeOptimization.Language
    lean: [soundness, valid_skip, valid_atom, valid_unreachable, valid_seq, valid_ite, valid_while, valid_call, valid_conseq, while_exec_bound, while_pre_bound, derivable_cost_le, countLoop_derivable, countLoop_cost, down_derivable, down_cost]
  - paper_labels: [prop:no-divergence]
    module: ImperativeOptimization.Divergence
    lean: [DivStep, Div, Div.unfold, PosWeights, div_prefixes_unbounded, valid_no_div, derivable_no_div, spin_div, spin_prefixes, spin_no_bound]
  - paper_labels: [def:certificate]
    note: "linear certificates and the executable checker"
    module: ImperativeOptimization.Checker
    lean: [PExp, Lin, SB, ACmd, ACmd.toCmd, check, entails1, entailsAll, loopBoundOk]
  - paper_labels: [thm:checker-soundness]
    module: ImperativeOptimization.Checker
    lean: [check_sound, shiftCert_checks, shiftCert_rejected, loop_sound, loopBoundOk_sound, certified_cost_le, entails1_sound, entailsAll_sound, Lin.subst_eval, Lin.inst_eval, Lin.eval_update, holds_update_logical, while_frame, countCert_checks, countCert_cost, countSym_checks, countSym_cost, logloop_sound, ilog_eq, ilogF_eq, logPot_step, logPot_le, ghostMul_eval, logCert_checks, logCert_rejected, logCert_base1_rejected, logCert_cost, growloop_sound, log_grow, growEntry_eval, ghostLow_eval, ghostGrow_eval, growCert_checks, growCert_rejected, growCert_needs_entry, growCert_cost, triloop_sound, dotN_set, SB.eval_only, triCert_checks, triCert_69_rejected, triCert_cost, uploop_sound, upLo_eval, upHi_eval, upCert_checks, upCert_53_rejected, upCert_cost, dotQ_append, dotQ_smul, qsub_le, dotQ_update, dotQ_crossQ, SB.eval_mul, SB.eval_of_const, SB.getD_q_nil, SB.qcomb_ge, prodCert_checks, prodCert_5_rejected, prodCert_cost]
  - paper_labels: [def:program-certificate, thm:program-soundness]
    note: "program certificates: calls checked against summaries, assumed contracts"
    module: ImperativeOptimization.Checker
    lean: [FunCert, FunSpec, checkFun, checkProgram, program_sound, exProgram_checks, exProgram_17_rejected, exMain_cost]
  - paper_labels: [def:minic, lem:nf-equiv, thm:validated]
    note: "validation of a certificate against its mini-C source (translation validation); MiniCCore has the definitions (no mathlib), MiniC the proofs"
    module: ImperativeOptimization.MiniC
    lean: [MStmt, MExp, MCond, lower, nf, app, validate, CEquiv, nf_equiv, app_equiv, seq_assoc, seq_skip_left, seq_skip_right, CImp.while, dot_trim, equiv_of_nf_eq, validate_lower, validated_sound, countCert_validated, countCert_not_validated]
  - paper_labels: [def:minic-jumps, thm:validated-jumps]
    note: "mini-C with break, continue, return, switch and do loops: direct semantics with outcomes (JExec), elimination of the jumps with flag variables computed by the checker (tr, elim, validateJ; MiniCJumpCore, no mathlib), simulation proved (sim), quietness of called functions checked syntactically (quietCmd)"
    module: ImperativeOptimization.MiniCJump
    lean: [JStmt, Outcome, JExec, MExec, MPre, CondStep, LoopTest, tr, trL, elim, validateJ, quietCmd, Quiet, Agree, exec_transfer, pre_transfer, lower_quiet, quiet_of_quietB, outcome_esc, foldl_unless, chain_skip, chain_drop, tr_loop_inv, tr_switch_inv, loop_main, sim, JExecD, desugar, desugar_exec, loop_step, tr_desugar, tr_okDo, desugar_ghosts, validatedJ_sound, breakSrc_elim, breakSrc_flag_clash]
  - paper_labels: [def:interrupt-model, lem:sporadic, thm:response-time]
    note: "response time of a computation under sporadic interrupt handlers (the set of activations of a handler may be infinite); the executable check is in ResponseCore (no mathlib)"
    module: ImperativeOptimization.Interrupts
    lean: [Handlers, Admissible, before, sporadic_count, handler_demand, response_time_bound, rtaIter_fixed, rtaHolds_sound, rtaHolds_mono, rtaSearch_sound, exH_iter, oneRun_admissible, oneRun_completes, perRun_admissible, perRun_completes]
  - paper_labels: [prop:graham]
    note: "Graham's bound for greedy scheduling of independent tasks, with certified task bounds"
    module: ImperativeOptimization.ForkJoin
    lean: [Greedy, greedy_bound, greedy_exists, forkjoin_bound, load_lower, makespan_lower, example_bound]
  - paper_labels: [prop:amortised-loop]
    note: "amortised loop rule (body cost a function of the potential): (1) cost growing with the potential, closed form for a + c*V (the checker's triOk); (2) a monotone bound of the potential itself, closed form for a + c*(K - V) (the checker's upOk, node whileUp); the closed forms are in Checker"
    module: ImperativeOptimization.Language
    lean: [valid_whileSum, whileSum_exec, whileSum_pre, triBound2_step, triBound2_ge, valid_whileMono, whileMono_exec, whileMono_pre, upSum_closed, upSum_mono, upSum_ge]
  - paper_labels: [prop:lex-log]
    module: ImperativeOptimization.Certificate
    lean: [lex_potential, lex_ranking_bound, log_ranking_bound]
  - paper_labels: [def:activation-tree, prop:stack]
    module: ImperativeOptimization.Stack
    lean: [ActTree, highWater_le_of_bound, highWater_le_depth]
  - paper_labels: [def:cycle-certificate, prop:cycles]
    paper: paper/binary/crosscheck-binary.tex
    note: "IPET cycle certificates of control-flow graphs (dual potentials and row multipliers; calls by depth induction); the graph, weights and rows are trusted"
    module: ImperativeOptimization.Cycles
    lean: [Run, Walk, checkFn, checkProgram, walk_bound, sum_dot, cycles_sound, program_sound, exLoop_checks, exLoop_tight, exLoop_run]
  - paper_labels: [def:machine-run, thm:machine-cycles]
    paper: paper/binary/crosscheck-binary.tex
    note: "cycle bounds of Cortex-M0 machine code: decoder and timing table (the trusted specification), graphs built from the code, every run bounded"
    module: ImperativeOptimization.Thumb
    lean: [decode, trans, Step, MRun, buildFn, checkBinary, chain_walk, translate, binary_sound, exBinary_checks, exBinary_tight, exBinary_run]
  - paper_labels: [def:data-run, def:loop-certificate, lem:cond-facts, thm:machine-loops]
    paper: paper/binary/crosscheck-binary.tex
    note: "loop bounds of Cortex-M0 machine code: data semantics (effects on r0-r7 and the flags, the trusted specification), certificates of invariants and potentials checked by Farkas multipliers, the rows of the certified loops hold on every data run"
    module: ImperativeOptimization.ThumbData
    lean: [effect, flagsAdd, flagsSub, condHolds, EffOk, XOk, XChain, DOkM, DOk, DRun, condFacts_sound, step_ok, chain_ok, chain_rows, drun_mrun, data_sound, exData_checks, exData_tight, exData_sound, effOkB_sound, chainB_sound, dOkB_sound, exData_run, congOk, congPE_sound, gExp_dvd, tightenL_holds, condFactsM_sound, exStep_checks, exStep_needs_cong, exStep_sound, invsAt, tgtIdx, tgtInv, invsAt_wf, tgtInv_mem, exWrap_checks, exWrap_needs_alt, exWrap_sound, gExpS, tightenS, gExpS_dvd, tightenS_holds, exZero_checks, exZero_needs_cong, exZero_sound]
  - paper_labels: [prop:jump-table]
    paper: paper/binary/crosscheck-binary.tex
    note: "jumps through a table (switch): the window CMP/BHI .. ADD PC or MOV PC evaluated by the checker for every index (definitions in ThumbCore and ThumbDataCore: JT, jumpTr, transJ, xop, xres, pcWrite, pcDestV, wstep, wrun, jumpOk, interiorOk); every data run follows a listed target, so the graph with the targets as edges bounds it"
    module: ImperativeOptimization.ThumbData
    lean: [JT, jumpTr, transJ, xop, xres, pcWrite, pcDestV, wstep, wrun, jumpOk, interiorOk, XOk, DOkM, lsForm, wbeg, wpred, wpath, wpath_mem, wpath_pred, interiorOk_spec, wstep_sound, wrun_sound, hi_false, ls_true, back_walk, jump_good, steps_good, reindex, drun_mrun, exSw_checks, exSw_data, exSw_needs_jt, exSw_target_missing, exSw_sound, exLs_checks, exLs_data, exLs_target_missing, exLs_sound]
  - paper_labels: [def:linked-run, def:convention, thm:machine-conv]
    paper: paper/binary/crosscheck-binary.tex
    note: "the calling convention checked on the code instead of assumed: linked data runs (a callee runs from the caller's state; PUSH/POP exact; no stack smashing), the check convOk, callees restore r4-r7 and SP, the bounds hold without the assumption abi"
    module: ImperativeOptimization.ThumbConv
    lean: [convOk, convAll, PushPopOk, SaveSafe, StepL, DChainL, DRunL, DOkT, nojump_steps, stepL_step, chainL_chain, ConvInv, conv_step, conv_ret, conv_chain, drunL_drun, data_sound_conv, exConv_checks, exConvData_checks, exConv_sound, exConv_run, exSave_conv, exClobber_refused, exMismatch_refused]
  - paper_labels: [prop:summary-call]
    note: "symbolic bounds and the call rule for function summaries"
    module: ImperativeOptimization.Language
    lean: [ValidSym, validSym_iff, validSym_call, validSym_seq]
  - paper_labels: [prop:context-bound]
    note: "bounds under proved invariants and calling contexts; call rule"
    module: ImperativeOptimization.Certificate
    lean: [run_invariant, ranking_bound_floor_of_invariant, ranking_bound_of_context, call_bound_of_context]
  - paper_labels: [subsubsec:smt-synthesis]
    note: "soundness direction of Farkas' Lemma"
    module: ImperativeOptimization.Certificate
    lean: [farkas_sound, farkas_sound_affine]
  - paper_labels: [subsubsec:tropical-semiring]
    note: "loop cost formula (row 'Loop cost formula' of Table 1; used by the Clang plugin of Paper II)"
    module: ImperativeOptimization.Certificate
    lean: [while_cost_bound]
  - paper_labels: [prop:size-potential]
    module: ImperativeOptimization.Arity
    lean: [callTree_size_le_potential, callTree_size_le_geom, geom_closed, RTree.size_le_geom, RTree.size_le_potential]
  - paper_labels: [sec:examples]
    module: ImperativeOptimization.Examples
    lean: [parametric_loop_minimal, parametric_loop_ranking, infinite_loop_diverges, linear_recursion_bigstep, binary_recursion_bigstep, binary_recursion_envelope]
not_formalized:
  - labels: [sec:application]
    reason: "the equation-generating rules describe a method of translation, not a statement; completeness of Farkas' Lemma is cited"
  - labels: [subsec:cost-logic]
    reason: "the remarks on weights and architectures and on parallel composition are not formalized"
  - labels: [subsec:concurrency]
    reason: "one unit of cost = one time slot is a property of the target; the busy-period extension of thm:response-time and greedy scheduling of task graphs with dependencies are discussed with references, not stated"
  - labels: [paper-II]
    reason: "the Clang plugin of Paper II (C++), its translation to certificates (or, for validated certificates, to mini-C) and the SMT solver are not verified"
