name: Lean 4 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Check Lean and Lake version
        run: |
          lean --version
          lake --version

      - name: Get Mathlib Cache
        run: |
          cd formalization
          lake exe cache get || true

      - name: Build Formalization
        run: |
          cd formalization
          lake build

      # The verified checker as a program (CheckerMain.lean; no mathlib needed).
      - name: Certificate checker
        run: |
          cd formalization
          lake build crosscheck-check
          # its JSON reader (JsonCore, no imports) against Lean.Json.parse
          lake build json-differential
          python3 test/json_differential.py --count 3000
          .lake/build/bin/crosscheck-check --print test/certificates/count.json
          # Every certificate of this file must be rejected (and the exit status be 1).
          if .lake/build/bin/crosscheck-check test/certificates/count_rejected.json > rejected.txt; then
            echo "a wrong certificate was accepted"; exit 1
          fi
          cat rejected.txt
          if grep -q '^ACCEPTED' rejected.txt; then echo "a wrong certificate was accepted"; exit 1; fi
          # Program certificates (calls, symbolic bounds, contracts): every program of
          # program_rejected.json must be rejected.
          .lake/build/bin/crosscheck-check --print test/certificates/program.json
          if .lake/build/bin/crosscheck-check test/certificates/program_rejected.json > prejected.txt; then
            echo "a wrong program certificate was accepted"; exit 1
          fi
          cat prejected.txt
          if grep -q '^PROGRAM.*ACCEPTED' prejected.txt; then echo "a wrong program certificate was accepted"; exit 1; fi
          # Mini-C sources: minic.json validates; no source of minic_rejected.json does
          # (each differs from the certificate's program).
          .lake/build/bin/crosscheck-check test/certificates/minic.json | tee minic.txt
          grep -q '^VALIDATED' minic.txt
          if .lake/build/bin/crosscheck-check test/certificates/minic_rejected.json > mrejected.txt; then
            echo "a wrong source was validated"; exit 1
          fi
          cat mrejected.txt
          if grep -q '^VALIDATED' mrejected.txt; then echo "a wrong source was validated"; exit 1; fi
          # Response-time claims: response.json holds; every claim of response_rejected.json fails.
          .lake/build/bin/crosscheck-check test/certificates/response.json | tee response.txt
          grep -q '^RESPONSE.*completes within' response.txt
          if .lake/build/bin/crosscheck-check test/certificates/response_rejected.json > rrejected.txt; then
            echo "a wrong response-time claim was accepted"; exit 1
          fi
          cat rrejected.txt
          if grep -q '^RESPONSE.*completes within' rrejected.txt; then echo "a wrong response-time claim was accepted"; exit 1; fi          # Qualification kit of the checker (docs/qualification): every requirement has
          # evidence that exists; exit statuses and large integers; mutated certificates
          # are rejected or still true when run by an independent interpreter.
          python3 ../docs/qualification/check_traceability.py
          sh ../docs/qualification/run_tests.sh .lake/build/bin/crosscheck-check
          python3 test/mutate_certificates.py .lake/build/bin/crosscheck-check test/certificates/program.json --mutants 150
          python3 test/mutate_certificates.py .lake/build/bin/crosscheck-check test/certificates/triangular.json test/certificates/products.json test/certificates/sizes.json test/certificates/assume.json --mutants 150
