name: Clang plugin CI

on:
  push:
    branches: [ main, master ]
    paths: [ 'clang-plugin/**', 'benchmarks/**', 'formalization/CheckerMain.lean',
             'formalization/ImperativeOptimization/CheckerCore.lean', '.github/workflows/plugin_build.yml' ]
  pull_request:
    branches: [ main, master ]
    paths: [ 'clang-plugin/**', 'benchmarks/**', 'formalization/CheckerMain.lean',
             'formalization/ImperativeOptimization/CheckerCore.lean', '.github/workflows/plugin_build.yml' ]
  workflow_dispatch:

jobs:
  build-and-test:
    # Pinned: Ubuntu 24.04 ships LLVM/Clang 18, Z3 4.8 and GoogleTest 1.14 as packages.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM/Clang 18, Z3, GoogleTest
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            llvm-18-dev libclang-18-dev clang-18 lld-18 \
            libz3-dev libgtest-dev python3-jsonschema python3-scipy \
            libzstd-dev zlib1g-dev libedit-dev libcurl4-openssl-dev libxml2-dev libffi-dev

      # The SARIF 2.1.0 schema (OASIS), for the ctest that validates the plugin's SARIF output.
      - name: SARIF schema
        run: curl -sSfL -o sarif-schema-2.1.0.json https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json

      - name: Configure
        run: cmake -S clang-plugin -B clang-plugin/build -G Ninja -DCMAKE_PREFIX_PATH=/usr/lib/llvm-18 -DCROSSCHECK_SARIF_SCHEMA=$PWD/sarif-schema-2.1.0.json

      - name: Build
        run: ninja -C clang-plugin/build

      # Unit tests (core, analyser), benchmark checks, and the plugin loaded into clang++.
      - name: Test
        run: ctest --test-dir clang-plugin/build --output-on-failure -j4

      - name: Benchmark summary
        run: |
          for f in benchmarks/*.cpp; do
            echo "== $f"
            clang-plugin/build/crosscheck-tool --summary "$f" -- -std=c++20 -Iclang-plugin/include || true
          done

      # Fetches a pinned TACLeBench revision; see benchmarks/tacle/README.md.
      - name: TACLeBench kernels (loop bounds vs. flow facts; cost certificates)
        run: python3 benchmarks/tacle/run_tacle.py --markdown=tacle.md --json=tacle.json --certificates=certificates/tacle --minic && cat tacle.md >> "$GITHUB_STEP_SUMMARY"

      - name: Certificates of the example programs
        run: |
          mkdir -p certificates/examples
          for f in benchmarks/*.cpp; do
            clang-plugin/build/crosscheck-tool --opt=certificates=certificates/examples/$(basename $f .cpp).json \
              "$f" -- -std=c++20 -Iclang-plugin/include >/dev/null 2>&1 || true
          done

      # Loop bounds for WCET tools (OTAWA: FFX; aiT: AIS2), SARIF for code scanning, and
      # the cost diff against the committed baseline (also enforced by ctest).
      - name: Flow facts, SARIF and cost diff of the example programs
        run: |
          mkdir -p exports/reports
          for f in benchmarks/*.cpp; do
            b=$(basename $f .cpp)
            clang-plugin/build/crosscheck-tool --report=exports/reports/$b.json \
              --opt=flowfacts=exports/$b.ffx --opt=sarif=exports/$b.sarif --opt=sarif-base=$PWD \
              "$f" -- -std=c++20 -Iclang-plugin/include >/dev/null 2>&1 || true
            clang-plugin/build/crosscheck-tool --opt=flowfacts=exports/$b.ais \
              "$f" -- -std=c++20 -Iclang-plugin/include >/dev/null 2>&1 || true
          done
          python3 clang-plugin/scripts/cost_diff.py benchmarks/bounds-baseline.json exports/reports \
            --exact --markdown cost-diff.md
          cat cost-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload flow facts and SARIF
        uses: actions/upload-artifact@v4
        with:
          name: exports
          path: exports/

      - name: Upload certificates
        uses: actions/upload-artifact@v4
        with:
          name: certificates
          path: certificates/

      # Also runs every kernel instrumented, and fails if a CrossCheck loop bound is
      # below a loop count observed on the kernel's input.
      - name: TACLeBench, comparison with LLVM ScalarEvolution and observed loop counts
        run: |
          python3 benchmarks/tacle/test_measure_loops.py --clang=/usr/lib/llvm-18/bin/clang --opt=/usr/lib/llvm-18/bin/opt
          python3 benchmarks/tacle/compare_tools.py --clang=/usr/lib/llvm-18/bin/clang --opt=/usr/lib/llvm-18/bin/opt --check
          python3 benchmarks/tacle/classify_unbounded.py

      # Rust front-end: MIR text is version-specific, so the toolchain is pinned.
      - name: Rust front-end (differential test of the MIR-to-C translation)
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          python3 frontends/rust/tests/test_rust.py --rustc "$(rustup which --toolchain 1.100.0 rustc)"

      # Cycle bounds of the kernels compiled for a Cortex-M0, each checked against an
      # emulated run (the interpreter is self-tested first).
      - name: Cortex-M0 cycle bounds
        run: |
          python3 benchmarks/cycles/test_m0.py
          python3 benchmarks/cycles/test_otawa_flow.py
          python3 benchmarks/cycles/test_ipet.py
          python3 benchmarks/cycles/test_binloops.py
          python3 benchmarks/cycles/run_cycles.py --clang=/usr/lib/llvm-18/bin/clang \
            --objdump=/usr/lib/llvm-18/bin/llvm-objdump --check --json=cycles.json \
            --certify=cycle-certificates --certify-loops

      # IPET cycle certificates of the same functions (their bounds were checked against
      # the runs above); the verified checker checks them in the next job.
      - name: Upload cycle certificates
        uses: actions/upload-artifact@v4
        with:
          name: cycle-certificates
          include-hidden-files: true
          path: |
            cycle-certificates/
            benchmarks/tacle/.cache/work/*.m0.o

      - name: Upload TACLeBench results
        uses: actions/upload-artifact@v4
        with:
          name: tacle-results
          path: tacle.json

  # The certificates emitted above, checked by the verified Lean checker.
  check-certificates:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build the checker
        run: cd formalization && lake build crosscheck-check

      - name: Download certificates
        uses: actions/download-artifact@v4
        with:
          name: certificates
          path: certificates

      - name: Check every certificate
        run: |
          formalization/.lake/build/bin/crosscheck-check certificates/*/*.json | tee checked.txt
          echo "Accepted: $(grep -c '^ACCEPTED' checked.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated against their mini-C source: $(grep -c '^VALIDATED' checked.txt)" >> "$GITHUB_STEP_SUMMARY"
          # `| tee` hides the checker's exit status (no pipefail): test its output instead.
          # A rejected certificate fails the step; so does a mini-C source that is not
          # validated, except the one documented in benchmarks/tacle/README.md (isqrt_main).
          if grep -E '^REJECTED|^PROGRAM .*REJECTED' checked.txt; then echo "a certificate was rejected"; exit 1; fi
          if grep '^NOT VALIDATED' checked.txt | grep -v '^NOT VALIDATED isqrt_main:'; then
            echo "a mini-C source was not validated"; exit 1
          fi

      - name: Download cycle certificates
        uses: actions/download-artifact@v4
        with:
          name: cycle-certificates
          path: cycle-certificates

      # Cycle bounds of the Cortex-M0 machine code (Lean Thumb.binary_sound: the checker
      # decodes the code and builds the graphs), with loop bounds certified on the code where
      # possible (Thumb.data_sound); altered certificates must be rejected; the Lean decoder is
      # compared with m0.py on every encoding and with llvm-objdump on the kernels' objects,
      # the Lean effects, flags and conditions with m0.py on every encoding.
      - name: Check the cycle certificates
        run: |
          formalization/.lake/build/bin/crosscheck-check cycle-certificates/cycle-certificates/*.json | tee cycles-checked.txt
          echo "Cycle bounds accepted: $(grep -c '^ACCEPTED' cycles-checked.txt)" >> "$GITHUB_STEP_SUMMARY"
          if grep -E '^REJECTED|^PROGRAM .*REJECTED' cycles-checked.txt; then echo "a cycle certificate was rejected"; exit 1; fi
          sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-scipy llvm-18
          python3 benchmarks/cycles/test_ipet.py --checker formalization/.lake/build/bin/crosscheck-check
          python3 benchmarks/cycles/test_binloops.py --checker formalization/.lake/build/bin/crosscheck-check
          python3 benchmarks/cycles/test_effect.py --checker formalization/.lake/build/bin/crosscheck-check
          python3 benchmarks/cycles/test_thumb.py --checker formalization/.lake/build/bin/crosscheck-check \
            --objects cycle-certificates/benchmarks/tacle/.cache/work --objdump /usr/lib/llvm-18/bin/llvm-objdump
